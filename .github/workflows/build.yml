name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # у каждой сборки свой номер: по нему установленная Linea понимает, что вышло обновление
      - run: npm version 0.2.${{ github.run_number }} --no-git-tag-version
      - run: npm run build --if-present
      # установщик, портативная версия и latest.yml (по нему Linea ищет обновления) — в релиз v0.2.N
      - run: npx electron-builder --win nsis portable --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # каждая сборка main сразу выкладывается в Releases: прямая ссылка на .exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Linea — тестовая сборка
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Тестовая сборка плеера Linea для Windows.
            Linea-*-portable.exe запускается без установки, Linea-*-setup.exe ставит плеер как обычную программу.
            Коммит: ${{ github.sha }}
          files: dist/*.exe
