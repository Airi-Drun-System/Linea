<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Linea — слова</title>
<style>
@font-face{font-family:"Onest";font-weight:800;src:url(fonts/onest-cyrillic-800-normal.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-weight:800;src:url(fonts/onest-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Onest";font-weight:600;src:url(fonts/onest-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-weight:600;src:url(fonts/onest-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
/* поверх игры: маленькая плашка по размеру строки, без лишнего */
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;font-family:Onest,"Segoe UI",sans-serif;--a1:#D4D4DA}
body{display:grid;place-items:center}
.box{display:inline-flex;flex-direction:column;align-items:center;gap:1px;max-width:calc(100vw - 16px);padding:7px 18px 8px;border-radius:14px;background:rgba(12,12,16,.66);transition:opacity .3s}
.box.hide{opacity:0}
.line{font-weight:800;font-size:23px;line-height:1.2;letter-spacing:-.01em;text-align:center;color:rgba(255,255,255,.5);text-shadow:0 1px 2px rgba(0,0,0,.6);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .w{transition:color .12s}
.line .w.sung{color:#fff}
.line.fill{background:linear-gradient(90deg,#fff calc(var(--p,0)*100%),rgba(255,255,255,.5) calc(var(--p,0)*100% + 4%));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.next{font-weight:600;font-size:13px;color:rgba(255,255,255,.5);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next:empty{display:none}
.swap{animation:up .25s cubic-bezier(.23,1,.32,1) both}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
/* режим «подвинуть»: видно рамку, окно тащится мышью */
body.move .box{outline:1.5px dashed rgba(255,255,255,.6);-webkit-app-region:drag;cursor:move}
.tip{display:none;font:600 11px Onest,sans-serif;color:rgba(255,255,255,.6)}
body.move .tip{display:block}
</style>
</head>
<body>
<div class="box hide" id="box"><div class="line" id="line"></div><div class="next" id="next"></div><div class="tip">Перетащи, куда удобно, и нажми «Готово» в Linea</div></div>
<script src="overlay.js"></script>
</body>
</html>
