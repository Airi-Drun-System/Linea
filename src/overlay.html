<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Linea — слова</title>
<style>
@font-face{font-family:"Onest";font-weight:800;src:url(fonts/onest-cyrillic-800-normal.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-weight:800;src:url(fonts/onest-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Onest";font-weight:600;src:url(fonts/onest-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-weight:600;src:url(fonts/onest-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
/* поверх игры: никакого фона окна, только плашка со словами */
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;font-family:Onest,"Segoe UI",sans-serif;--a1:#FF4D8D}
.box{position:absolute;inset:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 24px;border-radius:24px;background:rgba(8,8,12,.5);transition:opacity .4s}
.box.hide{opacity:0}
.line{font-weight:800;font-size:38px;line-height:1.15;text-align:center;color:rgba(255,255,255,.45);text-shadow:0 2px 10px rgba(0,0,0,.85);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .w{transition:color .15s}
.line .w.sung{color:#fff;text-shadow:0 0 18px var(--a1),0 2px 10px rgba(0,0,0,.85)}
.line.fill{background:linear-gradient(90deg,#fff calc(var(--p,0)*100%),rgba(255,255,255,.45) calc(var(--p,0)*100% + 6%));-webkit-background-clip:text;background-clip:text;color:transparent}
.next{font-weight:600;font-size:20px;color:rgba(255,255,255,.55);text-shadow:0 2px 8px rgba(0,0,0,.85);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swap{animation:up .35s cubic-bezier(.22,1,.36,1) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
/* режим «подвинуть»: видно рамку, окно тащится мышью */
body.move .box{outline:2px dashed var(--a1);background:rgba(8,8,12,.75);-webkit-app-region:drag;cursor:move}
.tip{display:none;font:600 13px Onest,sans-serif;color:var(--a1)}
body.move .tip{display:block}
</style>
</head>
<body>
<div class="box hide" id="box"><div class="line" id="line"></div><div class="next" id="next"></div><div class="tip">Перетащи, куда удобно, и нажми «Готово» в Linea</div></div>
<script src="overlay.js"></script>
</body>
</html>
